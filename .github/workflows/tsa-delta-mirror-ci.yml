name: tsa-delta-mirror CI

on:
  push:
    branches: [main]
    paths: ["tsa-delta-mirror/**", ".github/workflows/tsa-delta-mirror-ci.yml"]
  pull_request:
    paths: ["tsa-delta-mirror/**", ".github/workflows/tsa-delta-mirror-ci.yml"]
  workflow_dispatch:
    inputs:
      run_compose_integration:
        description: "Also run the docker-compose integration test (reference server + MinIO)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: tsa-delta-mirror

jobs:
  lint-type-test:
    name: ruff, mypy, pytest (unit + in-process integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"
      - name: ruff
        run: |
          .venv/bin/ruff format --check src tests scripts
          .venv/bin/ruff check src tests scripts
      - name: mypy (strict on src/)
        run: .venv/bin/mypy
      - name: pytest
        run: .venv/bin/pytest -q --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: tsa-delta-mirror/pytest.xml

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate

  image:
    name: docker build, SBOM, pip-audit
    runs-on: ubuntu-latest
    needs: [lint-type-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: tsa-delta-mirror
          push: false
          load: true
          tags: tsa-delta-mirror:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root and starts
        run: |
          docker run --rm --entrypoint id tsa-delta-mirror:ci
          docker run --rm tsa-delta-mirror:ci --help
      - name: SBOM (CycloneDX via syft)
        uses: anchore/sbom-action@v0
        with:
          image: tsa-delta-mirror:ci
          format: cyclonedx-json
          output-file: tsa-delta-mirror/sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: pip-audit against the locked runtime dependencies
        run: |
          uv venv .venv && uv pip install pip-audit==2.10.0
          .venv/bin/pip-audit -r requirements.lock.txt --require-hashes --strict --desc

  compose-integration:
    name: reference server + MinIO (opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_compose_integration
    needs: [lint-type-test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv .venv && uv pip install -e ".[dev]"
      - name: Start stack
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 300
      - name: Seed provider tables
        run: .venv/bin/python scripts/seed_share.py
      - name: Run compose-marked tests
        run: .venv/bin/pytest -q -m compose tests/integration/test_compose_stack.py
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail=200
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v
