[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "delta-sharing-mirror"
version = "0.1.0"
description = "Mirror Delta Sharing tables into plain Delta Lake tables on S3 (no Spark, no Databricks dependency)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "delta-sharing==1.4.2",
  "deltalake==1.6.6",
  "pandas==2.3.3",
  "pyarrow==23.0.1",
  "boto3==1.43.118",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.17.2",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "moto[s3,dynamodb,secretsmanager,cloudwatch,glue,server]==5.2.4",
  "duckdb==2.0.0",
  "pandas-stubs==2.3.3.251219",
  "boto3-stubs[secretsmanager,dynamodb,cloudwatch,glue,s3]==1.43.118",
  "pip-audit==2.10.0",
  "cyclonedx-bom==7.3.1",
]

[project.scripts]
delta-sharing-mirror = "delta_sharing_mirror.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/delta_sharing_mirror"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W", "RUF", "PL", "T20"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR", "T20"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["delta_sharing", "delta_sharing.*", "deltalake", "deltalake.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: in-process end-to-end tests (fake sharing server + local/moto S3)",
  "compose: tests that need the docker-compose stack (reference server + MinIO)",
]
addopts = "-m 'not compose'"
filterwarnings = ["ignore::DeprecationWarning"]
